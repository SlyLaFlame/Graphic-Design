<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poster Design | Shem Aberi</title>
<meta name="description" content="Posters designed for the Kenya Institute of Highways and Building Technology (KIHBT).">
<style>
  :root { --bg:#080808; --card:#262626; --pink:#ff004f; --text:#f2f2f2; --muted:#ababab; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Poppins','Segoe UI',system-ui,sans-serif; min-height:100vh; }
  header { padding:56px 20px 36px; text-align:center; }
  header a { color:var(--muted); text-decoration:none; font-size:.95rem; }
  header a:hover { color:var(--pink); }
  h1 { margin-top:20px; font-size:clamp(2rem,6vw,3.2rem); color:var(--pink); }
  header p { margin:12px auto 0; max-width:560px; color:var(--muted); }
  .grid { max-width:1200px; margin:0 auto; padding:20px 20px 80px; display:grid; gap:24px;
          grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); }
  .poster { background:var(--card); border:0; border-radius:10px; overflow:hidden; cursor:pointer;
            color:inherit; text-align:left; transition:transform .25s; }
  .poster:hover { transform:translateY(-6px); }
  .poster img { display:block; width:100%; aspect-ratio:3/4; object-fit:contain; background:#111; }
  .poster span { display:block; padding:12px 14px; font-size:.9rem; color:var(--muted); }
  .lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,.93); z-index:10;
              align-items:center; justify-content:center; padding:24px; }
  .lightbox.open { display:flex; }
  .lightbox img { max-width:92vw; max-height:88vh; border-radius:8px; }
  .close { position:absolute; top:20px; right:24px; width:44px; height:44px; border:0; border-radius:50%;
           background:var(--pink); color:#fff; font-size:1.4rem; cursor:pointer; }
  footer { text-align:center; padding:24px; color:var(--muted); font-size:.85rem; border-top:1px solid #222; }
</style>
</head>
<body>

<header>
  <a href="https://shemnyangate.co.ke">&larr; Go to portfolio</a>
  <h1>Poster Design</h1>
  <p>Posters designed for the Kenya Institute of Highways and Building Technology (KIHBT).</p>
</header>

<main class="grid" id="grid"></main>

<div class="lightbox" id="lightbox">
  <button class="close" id="close" aria-label="Close">&times;</button>
  <img id="big" src="" alt="">
</div>

<footer>&copy; 2026 Shem Aberi</footer>
<script src="posters.js"></script>
<script>
 

  const grid = document.getElementById("grid");
  const box = document.getElementById("lightbox");
  const big = document.getElementById("big");

  posters.forEach(p => {
    const b = document.createElement("button");
    b.className = "poster";
    b.innerHTML = `<img src="${p.src}" alt="${p.caption}" loading="lazy"><span>${p.caption}</span>`;
    b.onclick = () => { big.src = p.src; big.alt = p.caption; box.classList.add("open"); };
    grid.appendChild(b);
  });

  const shut = () => box.classList.remove("open");
  document.getElementById("close").onclick = shut;
  box.onclick = e => { if (e.target === box) shut(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape") shut(); });
</script>
</body>
</html>
